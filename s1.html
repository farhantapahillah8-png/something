<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            color: white;
            padding: 30px;
            z-index: 2;
        }

        .heart {
            font-size: 80px;
            animation: denyut 1s infinite;
        }

        h1 {
            font-size: 40px;
            margin: 15px 0;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            max-width: 600px;
            margin: auto;
        }

        button {
            margin-top: 25px;
            padding: 14px 30px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #ff4f81;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            background: #ffe1eb;
        }

        #pesan {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            display: none;
        }

        .love {
            position: absolute;
            bottom: -50px;
            font-size: 25px;
            animation: naik 6s linear infinite;
            opacity: 0.8;
        }

        @keyframes denyut {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.25);
            }
        }

        @keyframes naik {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="heart">❤️</div>

        <h1>Untuk Kamu</h1>

        <p>
            Aku mungkin tidak selalu pandai mengungkapkan perasaan,
            tapi satu hal yang pasti...
            kehadiranmu selalu membuat hari-hariku menjadi lebih indah.
        </p>

        <button onclick="tampilkanPesan()">
            Klik Aku ❤️
        </button>

        <div id="pesan">
            Terima kasih sudah menjadi seseorang yang begitu berarti. ❤️
        </div>
    </div>

    <script>
        function tampilkanPesan() {
            document.getElementById("pesan").style.display = "block";
        }

        function buatHati() {
            const heart = document.createElement("div");

            heart.classList.add("love");
            heart.innerHTML = "❤️";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (Math.random() * 3 + 4) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        setInterval(buatHati, 500);
    </script>

</body>
</html>
